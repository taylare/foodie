<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Foodie</title>
  <meta name="description" content="Your recipes, meal plan and shopping list in one pocket-sized app." />

  <!-- Installable app -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#fff4c9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#16131c" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Foodie" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />

  <script>
    // Apply theme before first paint to avoid a flash
    try {
      var t = localStorage.getItem('foodie-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <main id="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Main">
      <a href="#/" data-tab="today"><span class="tab-ico" aria-hidden="true">🏠</span><span>Today</span></a>
      <a href="#/recipes" data-tab="recipes"><span class="tab-ico" aria-hidden="true">📖</span><span>Recipes</span></a>
      <a href="#/plan" data-tab="plan"><span class="tab-ico" aria-hidden="true">🗓️</span><span>Plan</span></a>
      <a href="#/shop" data-tab="shop"><span class="tab-ico" aria-hidden="true">🛒</span><span>Shop</span><b class="tab-badge" id="shopBadge" hidden></b></a>
      <a href="#/discover" data-tab="discover"><span class="tab-ico" aria-hidden="true">✨</span><span>Discover</span></a>
    </nav>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <noscript>Foodie needs JavaScript turned on.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
